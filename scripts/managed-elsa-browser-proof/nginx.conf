events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 443 ssl;
    server_name runtime.localhost;

    ssl_certificate /proof-tls/tls.crt;
    ssl_certificate_key /proof-tls/tls.key;

    location / {
      proxy_pass http://managed-runtime:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 443 ssl;
    server_name control.localhost;

    ssl_certificate /proof-tls/tls.crt;
    ssl_certificate_key /proof-tls/tls.key;

    location / {
      proxy_pass https://host.docker.internal:7094;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /proof-tls/local-root-ca.crt;
      proxy_ssl_server_name on;
      proxy_ssl_name localhost;
      proxy_set_header Host localhost:7094;
      proxy_set_header X-Forwarded-Host localhost:7094;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
