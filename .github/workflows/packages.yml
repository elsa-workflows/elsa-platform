name: Packages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show dotnet version
        run: dotnet --version

      - name: Compute package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Directory.Build.props ]; then
            echo "Directory.Build.props not found"
            exit 1
          fi

          BASE_VERSION=$(grep -m 1 '<Version>' Directory.Build.props | sed -E 's/.*<Version>([^<]+)<.*/\1/' || true)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(grep -m 1 '<VersionPrefix>' Directory.Build.props | sed -E 's/.*<VersionPrefix>([^<]+)<.*/\1/' || true)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="0.1.0"
            echo "No Version or VersionPrefix found in Directory.Build.props. Falling back to $BASE_VERSION."
          fi

          PACKAGE_VERSION="${BASE_VERSION}-preview.${GITHUB_RUN_NUMBER}"
          echo "Using validation package version: $PACKAGE_VERSION"

          echo "package-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore ValenceControl.sln

      - name: Build
        run: dotnet build ValenceControl.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ValenceControl.sln --configuration Release --no-build --verbosity normal

      - name: Pack packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts

          projects=(
            "src/PackageManifests/ValenceControl.PackageManifests/ValenceControl.PackageManifests.csproj"
            "src/PackageManifests/ValenceControl.PackageManifest.Generator/ValenceControl.PackageManifest.Generator.csproj"
          )

          for proj in "${projects[@]}"; do
            echo "Packing $proj..."
            dotnet pack "$proj" \
              --configuration Release \
              --no-build \
              -o ./artifacts \
              /p:Version="${PACKAGE_VERSION}"
          done

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valence-control-nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 7
