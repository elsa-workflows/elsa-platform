name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show dotnet version
        run: dotnet --version

      - name: Restore
        run: dotnet restore ElsaControl.sln

      - name: Build
        run: dotnet build ElsaControl.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ElsaControl.sln --configuration Release --no-build --verbosity normal

  console:
    name: Console quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Hosting/ElsaControl.Console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Hosting/ElsaControl.Console/package-lock.json

      - name: Install locked console dependencies
        run: npm ci

      - name: Run console unit tests
        run: npm test

      - name: Typecheck console
        run: npm run typecheck

      - name: Build production console bundle
        run: npm run build
