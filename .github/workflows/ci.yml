name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show dotnet version
        run: dotnet --version

      - name: Restore
        run: dotnet restore ElsaControl.sln

      - name: Build
        run: dotnet build ElsaControl.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ElsaControl.sln --configuration Release --no-build --verbosity normal
