name: Azure Control API Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub environment to deploy."
        required: true
        default: production
        type: choice
        options:
          - development
          - test
          - production
      deploy_mode:
        description: "Use app for code-only deployment; use infra to provision/update Bicep resources."
        required: true
        default: app
        type: choice
        options:
          - app
          - infra

concurrency:
  group: azure-api-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and Deploy Control API
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'app' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      SQL_ADMINISTRATOR_LOGIN: ${{ vars.SQL_ADMINISTRATOR_LOGIN }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      BUILDER_CLIENT_API_KEY: ${{ secrets.BUILDER_CLIENT_API_KEY }}
      SQL_ADMINISTRATOR_PASSWORD: ${{ secrets.SQL_ADMINISTRATOR_PASSWORD }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Hosting/ElsaControl.Console/package-lock.json

      - name: Check deployment configuration
        id: deployment-config
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_ENV_NAME
            AZURE_LOCATION
            AZURE_RESOURCE_GROUP
            AZURE_WEBAPP_NAME
            AZURE_CONTAINER_REGISTRY_ENDPOINT
          )

          if [ "$DEPLOY_MODE" = "infra" ]; then
            required+=(
              ADMIN_API_KEY
              SQL_ADMINISTRATOR_PASSWORD
            )
          fi

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "deploy_configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing_names="$(IFS=', '; echo "${missing[*]}")"
          echo "deploy_configured=false" >> "$GITHUB_OUTPUT"
          echo "missing_names=$missing_names" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Deployment configuration is incomplete. Missing: $missing_names"
            exit 1
          fi

          echo "::notice::Deployment skipped because configuration is incomplete. Missing: $missing_names"

      - name: Restore
        run: dotnet restore ElsaControl.sln

      - name: Build AppHost
        run: dotnet build src/Hosting/ElsaControl.AppHost/ElsaControl.AppHost.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test tests/Hosting/ElsaControl.Api.Tests/ElsaControl.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Build and test console
        working-directory: src/Hosting/ElsaControl.Console
        run: |
          npm ci
          npm test
          npm run build

      - name: Log in Azure CLI
        if: steps.deployment-config.outputs.deploy_configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current API deployment
        id: current-deployment
        if: steps.deployment-config.outputs.deploy_configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          linux_fx_version="$(az webapp config show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query linuxFxVersion \
            --output tsv)"
          if [ -z "$linux_fx_version" ]; then
            echo "::error::Could not capture the current Linux runtime image; refusing an unprotected deployment."
            exit 1
          fi
          if [[ ! "$linux_fx_version" =~ ^DOCKER\|[[:alnum:]][[:alnum:]._:/@=-]*$ ]]; then
            echo "::error::The captured Docker runtime image has an unexpected or unsafe format."
            exit 1
          fi

          application_build_number="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query "[?name=='Application__BuildNumber'] | [0].value" \
            --output tsv)"

          if [ -n "$application_build_number" ]; then
            if [[ ! "$application_build_number" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$ ]]; then
              echo "::error::The captured Application__BuildNumber has an unexpected or unsafe format."
              exit 1
            fi

            echo "application_build_number_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "application_build_number_present=false" >> "$GITHUB_OUTPUT"
          fi
          echo "linux_fx_version=$linux_fx_version" >> "$GITHUB_OUTPUT"
          if [ -n "$application_build_number" ]; then
            echo "application_build_number=$application_build_number" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy API app
        id: deploy-api
        if: steps.deployment-config.outputs.deploy_configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$DEPLOY_MODE" = "infra" ]; then
            scripts/deploy-azure-elsa-control.sh \
              --environment "$AZURE_ENV_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --image-tag "$GITHUB_SHA"
          else
            image="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api:${GITHUB_SHA}"
            acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"

            az acr login --name "$acr_name"
            docker build --file src/Hosting/ElsaControl.Api/Dockerfile --tag "$image" .
            docker push "$image"

            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings AZURE_TOKEN_CREDENTIALS=prod Application__BuildNumber="$GITHUB_RUN_NUMBER" \
              --output none

            az webapp config container set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --container-image-name "$image" \
              --container-registry-url "https://$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
              --output none

          fi

          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --output none

      - name: Verify deployed API health
        id: health-gate
        if: ${{ success() && steps.deployment-config.outputs.deploy_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if ! default_host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"; then
            echo "::error::Could not resolve the API host for the post-deployment health check."
            exit 1
          fi
          if [ -z "$default_host_name" ]; then
            echo "::error::Azure returned no API host for the post-deployment health check."
            exit 1
          fi
          health_url="https://$default_host_name/health"

          for attempt in $(seq 1 30); do
            if http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$health_url")"; then
              if [ "$http_status" = "200" ]; then
                echo "API health check passed with HTTP 200 on attempt $attempt."
                exit 0
              fi
            else
              http_status=000
            fi

            echo "API health check returned HTTP $http_status (attempt $attempt/30); retrying."
            sleep 10
          done

          echo "::error::API health check failed after deployment: $health_url"
          exit 1

      - name: Restore previous API deployment after health failure
        if: ${{ failure() && steps.current-deployment.outcome == 'success' && (steps.deploy-api.outcome == 'failure' || steps.health-gate.outcome == 'failure') }}
        env:
          PREVIOUS_LINUX_FX_VERSION: ${{ steps.current-deployment.outputs.linux_fx_version }}
          PREVIOUS_BUILD_NUMBER: ${{ steps.current-deployment.outputs.application_build_number }}
          PREVIOUS_BUILD_NUMBER_PRESENT: ${{ steps.current-deployment.outputs.application_build_number_present }}
        shell: bash
        run: |
          set -euo pipefail

          if ! az webapp config set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --linux-fx-version "$PREVIOUS_LINUX_FX_VERSION" \
              --output none; then
            echo "::error::Rollback failed: could not restore the previous Linux runtime image."
            exit 1
          fi

          if [ "$PREVIOUS_BUILD_NUMBER_PRESENT" = true ]; then
            if ! az webapp config appsettings set \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --settings "Application__BuildNumber=$PREVIOUS_BUILD_NUMBER" \
                --output none; then
              echo "::error::Rollback failed: could not restore the previous Application__BuildNumber."
              exit 1
            fi
          else
            if ! az webapp config appsettings delete \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --setting-names Application__BuildNumber \
                --output none; then
              echo "::error::Rollback failed: could not remove the previous Application__BuildNumber."
              exit 1
            fi
          fi

          if ! az webapp restart \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --output none; then
            echo "::error::Rollback failed: could not restart the API after restoring the previous deployment."
            exit 1
          fi

          if ! default_host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)"; then
            echo "::error::Rollback failed: could not resolve the API host after restoring the previous deployment."
            exit 1
          fi
          if [ -z "$default_host_name" ]; then
            echo "::error::Rollback failed: Azure returned no API host after restoring the previous deployment."
            exit 1
          fi

          rollback_health_url="https://$default_host_name/health"
          rollback_health_succeeded=false
          for attempt in $(seq 1 30); do
            if http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$rollback_health_url")"; then
              if [ "$http_status" = "200" ]; then
                rollback_health_succeeded=true
                echo "Rollback health check passed with HTTP 200 on attempt $attempt."
                break
              fi
            else
              http_status=000
            fi

            echo "Rollback health check returned HTTP $http_status (attempt $attempt/30); retrying."
            sleep 10
          done

          if [ "$rollback_health_succeeded" != true ]; then
            echo "::error::Rollback failed: the previous API deployment did not return HTTP 200 at $rollback_health_url."
            exit 1
          fi

          echo "::error::API health gate failed; restored the previous Linux image and build metadata."
