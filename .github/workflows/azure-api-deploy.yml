name: Azure Control API Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub environment to deploy."
        required: true
        default: production
        type: choice
        options:
          - development
          - test
          - production
      deploy_mode:
        description: "Use app for code-only deployment; use infra to provision/update Bicep resources."
        required: true
        default: app
        type: choice
        options:
          - app
          - infra

concurrency:
  group: azure-api-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and Deploy Control API
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'app' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      SQL_ADMINISTRATOR_LOGIN: ${{ vars.SQL_ADMINISTRATOR_LOGIN }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      BUILDER_CLIENT_API_KEY: ${{ secrets.BUILDER_CLIENT_API_KEY }}
      SQL_ADMINISTRATOR_PASSWORD: ${{ secrets.SQL_ADMINISTRATOR_PASSWORD }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Hosting/ElsaControl.Console/package-lock.json

      - name: Check deployment configuration
        id: deployment-config
        shell: bash
        run: |
          set -euo pipefail

          required=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_ENV_NAME
            AZURE_LOCATION
            AZURE_RESOURCE_GROUP
            AZURE_WEBAPP_NAME
            AZURE_CONTAINER_REGISTRY_ENDPOINT
          )

          if [ "$DEPLOY_MODE" = "infra" ]; then
            required+=(
              ADMIN_API_KEY
              SQL_ADMINISTRATOR_PASSWORD
            )
          fi

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "deploy_configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing_names="$(IFS=', '; echo "${missing[*]}")"
          echo "deploy_configured=false" >> "$GITHUB_OUTPUT"
          echo "missing_names=$missing_names" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Deployment configuration is incomplete. Missing: $missing_names"
            exit 1
          fi

          echo "::notice::Deployment skipped because configuration is incomplete. Missing: $missing_names"

      - name: Restore
        run: dotnet restore ElsaControl.sln

      - name: Build AppHost
        run: dotnet build src/Hosting/ElsaControl.AppHost/ElsaControl.AppHost.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test tests/Hosting/ElsaControl.Api.Tests/ElsaControl.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Build and test console
        working-directory: src/Hosting/ElsaControl.Console
        run: |
          npm ci
          npm test
          npm run build

      - name: Log in Azure CLI
        if: steps.deployment-config.outputs.deploy_configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API app
        if: steps.deployment-config.outputs.deploy_configured == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$DEPLOY_MODE" = "infra" ]; then
            scripts/deploy-azure-elsa-control.sh \
              --environment "$AZURE_ENV_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --image-tag "$GITHUB_SHA"
          else
            image="$AZURE_CONTAINER_REGISTRY_ENDPOINT/elsa-control/api:${GITHUB_SHA}"
            acr_name="${AZURE_CONTAINER_REGISTRY_ENDPOINT%%.azurecr.io}"

            az acr login --name "$acr_name"
            docker build --file src/Hosting/ElsaControl.Api/Dockerfile --tag "$image" .
            docker push "$image"

            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --settings AZURE_TOKEN_CREDENTIALS=prod Application__BuildNumber="$GITHUB_RUN_NUMBER" \
              --output none

            az webapp config container set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --container-image-name "$image" \
              --container-registry-url "https://$AZURE_CONTAINER_REGISTRY_ENDPOINT" \
              --output none

            az webapp restart \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --output none
          fi
