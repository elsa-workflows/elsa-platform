name: Elsa Healing Repair
run-name: Elsa Healing ${{ inputs.attempt_id }}

on:
  workflow_dispatch:
    inputs:
      platform_url:
        description: HTTPS base URL of Elsa Platform.
        required: true
        type: string
      workspace_id:
        description: Workspace bound to the repair attempt.
        required: true
        type: string
      incident_id:
        required: true
        type: string
      attempt_id:
        description: Authorized repair attempt identifier.
        required: true
        type: string
      attempt_nonce:
        description: One-use nonce issued for proposal creation.
        required: true
        type: string
      producing_revision_status:
        required: true
        type: string
      producing_revision:
        required: false
        type: string
      workload_audience:
        description: OIDC audience configured by Elsa Platform.
        required: true
        type: string
      target_branch:
        required: true
        type: string
      expected_target_revision:
        description: Immutable target revision selected by Platform.
        required: true
        type: string

# No permission is inherited by every job. Each trust boundary declares only the
# GitHub permissions it needs.
permissions: {}

concurrency:
  group: elsa-healing-${{ inputs.attempt_id }}
  cancel-in-progress: false

jobs:
  propose:
    name: Create managed repair proposal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      proposal_id: ${{ steps.proposal.outputs.proposal_id }}
      proposal_digest: ${{ steps.proposal.outputs.proposal_digest }}
      proposal_artifact_digest: ${{ steps.proposal.outputs.proposal_artifact_digest }}
      finalization_nonce: ${{ steps.proposal.outputs.finalization_nonce }}
    steps:
      - name: Check out the approved revision without stored credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.expected_target_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect bounded inert source context
        shell: bash
        env:
          EXPECTED_TARGET_REVISION: ${{ inputs.expected_target_revision }}
          SOURCE_CONTEXT_PATH: ${{ runner.temp }}/elsa-healing-source-context.json
        run: |
          set -euo pipefail
          # This embedded collector reads inert blobs from Git's object database.
          # It never imports or invokes repository-owned code, hooks, filters,
          # scripts, build targets, package managers, or executables.
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          revision = os.environ["EXPECTED_TARGET_REVISION"]
          output_path = os.environ["SOURCE_CONTEXT_PATH"]
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("expected target revision is not an immutable SHA-1")
          head = subprocess.run(
              ["git", "rev-parse", "HEAD"], check=True, capture_output=True, text=True
          ).stdout.strip()
          if head != revision:
              raise SystemExit("checked-out revision does not match the approved target")

          allowed_suffixes = (
              ".cs", ".csproj", ".props", ".targets", ".sln", ".slnx",
              ".json", ".yaml", ".yml", ".xml", ".config", ".ts", ".tsx",
              ".js", ".jsx", ".py", ".go", ".rs", ".java", ".kt", ".kts",
              ".fs", ".fsproj", ".vb", ".vbproj", ".c", ".cc", ".cpp",
              ".h", ".hpp",
          )
          excluded_roots = {".agents", ".github", ".specify", "docs", "specs", "templates"}
          excluded_parts = {"node_modules", "bin", "obj", "dist", "coverage"}
          maximum_files = 128
          maximum_omissions = 256
          maximum_file_bytes = 65_536
          maximum_total_bytes = 524_288

          tree = subprocess.run(
              ["git", "ls-tree", "-r", "-z", "-l", "--full-tree", revision],
              check=True,
              capture_output=True,
          ).stdout
          files = []
          omitted_paths = []
          total_bytes = 0
          for raw_entry in tree.split(b"\0"):
              if not raw_entry:
                  continue
              metadata, raw_path = raw_entry.split(b"\t", 1)
              mode, object_type, object_id, raw_size = metadata.split()
              if object_type != b"blob" or mode == b"120000":
                  continue
              try:
                  path = raw_path.decode("utf-8", "strict")
              except UnicodeDecodeError:
                  continue
              pure_path = pathlib.PurePosixPath(path)
              if (
                  len(path) > 1024
                  or path.startswith("/")
                  or "\\" in path
                  or ":" in path
                  or any(ord(character) < 32 or ord(character) == 127 for character in path)
                  or any(part in ("", ".", "..") for part in pure_path.parts)
                  or not path.lower().endswith(allowed_suffixes)
                  or pure_path.parts[0].lower() in excluded_roots
                  or any(part.lower() in excluded_parts for part in pure_path.parts)
              ):
                  continue
              size = int(raw_size)
              if (
                  size > maximum_file_bytes
                  or total_bytes + size > maximum_total_bytes
                  or len(files) >= maximum_files
              ):
                  if len(omitted_paths) < maximum_omissions:
                      omitted_paths.append(path)
                  continue

              raw_content = subprocess.run(
                  ["git", "cat-file", "blob", object_id.decode("ascii")],
                  check=True,
                  capture_output=True,
              ).stdout
              try:
                  content = raw_content.decode("utf-8", "strict")
              except UnicodeDecodeError:
                  if len(omitted_paths) < maximum_omissions:
                      omitted_paths.append(path)
                  continue
              digest = "sha256:" + hashlib.sha256(raw_content).hexdigest()
              files.append({"path": path, "content": content, "digest": digest, "isTruncated": False})
              total_bytes += len(raw_content)

          if not files:
              raise SystemExit("no bounded UTF-8 source files were available")
          canonical = revision
          for source_file in files:
              canonical += (
                  "\n" + source_file["path"] + "\n" + source_file["digest"] + "\n0"
              )
          for path in omitted_paths:
              canonical += "\nomitted:" + path
          source_context = {
              "targetRevision": revision,
              "digest": "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest(),
              "files": files,
              "omittedPaths": omitted_paths,
          }
          encoded = json.dumps(source_context, ensure_ascii=False, separators=(",", ":"), sort_keys=True)
          if len(encoded.encode("utf-8")) > 1_048_576:
              raise SystemExit("source context exceeded its transport bound")
          with open(output_path, "w", encoding="utf-8", newline="") as output:
              output.write(encoded)
          PY

      - name: Exchange OIDC identity for a proposal capability
        id: capability
        shell: bash
        env:
          PLATFORM_BASE_URL: ${{ inputs.platform_url }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ONE_TIME_NONCE: ${{ inputs.attempt_nonce }}
          WORKLOAD_AUDIENCE: ${{ inputs.workload_audience }}
        run: |
          set -euo pipefail
          test "${PLATFORM_BASE_URL#https://}" != "${PLATFORM_BASE_URL}"
          identity_assertion="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(jq -rn --arg value "${WORKLOAD_AUDIENCE}" '$value|@uri')" | jq -er '.value')"
          exchange_payload="$(jq -cn \
            --arg attemptId "${ATTEMPT_ID}" \
            --arg nonce "${ONE_TIME_NONCE}" \
            --arg assertion "${identity_assertion}" \
            '{protocolVersion:"1.0",purpose:"proposal",attemptId:$attemptId,oneTimeNonce:$nonce,identityAssertion:$assertion}')"
          capability="$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary "${exchange_payload}" \
            "${PLATFORM_BASE_URL%/}/api/workspaces/${WORKSPACE_ID}/healing/workload/exchange" | jq -er '.capabilityToken')"
          echo "::add-mask::${capability}"
          printf 'token=%s\n' "${capability}" >> "${GITHUB_OUTPUT}"

      - name: Retrieve bounded evidence
        shell: bash
        env:
          PLATFORM_BASE_URL: ${{ inputs.platform_url }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          CAPABILITY_TOKEN: ${{ steps.capability.outputs.token }}
          EVIDENCE_PATH: ${{ runner.temp }}/elsa-healing-evidence.json
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CAPABILITY_TOKEN}" \
            "${PLATFORM_BASE_URL%/}/api/workspaces/${WORKSPACE_ID}/healing/workload/attempts/${ATTEMPT_ID}/evidence" \
            --output "${EVIDENCE_PATH}"
          test "$(wc -c < "${EVIDENCE_PATH}")" -le 1048576
          jq -e --arg attemptId "${ATTEMPT_ID}" \
            '.protocolVersion == "1.0" and .attemptId == $attemptId' \
            "${EVIDENCE_PATH}" >/dev/null

      - name: Ask Elsa Platform for a managed proposal
        id: proposal
        shell: bash
        env:
          PLATFORM_BASE_URL: ${{ inputs.platform_url }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          CAPABILITY_TOKEN: ${{ steps.capability.outputs.token }}
          SOURCE_CONTEXT_PATH: ${{ runner.temp }}/elsa-healing-source-context.json
          PROPOSAL_PATH: ${{ runner.temp }}/elsa-healing-proposal.json
        run: |
          set -euo pipefail
          request="${RUNNER_TEMP}/elsa-healing-proposal-request.json"
          response="${RUNNER_TEMP}/elsa-healing-proposal-response.json"
          jq -cn \
            --arg attemptId "${ATTEMPT_ID}" \
            --arg idempotencyKey "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-proposal" \
            --slurpfile sourceContext "${SOURCE_CONTEXT_PATH}" \
            '{protocolVersion:"1.0",attemptId:$attemptId,idempotencyKey:$idempotencyKey,sourceContext:$sourceContext[0]}' \
            > "${request}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CAPABILITY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@${request}" \
            "${PLATFORM_BASE_URL%/}/api/workspaces/${WORKSPACE_ID}/healing/workload/attempts/${ATTEMPT_ID}/proposal" \
            --output "${response}"

          proposal_id="$(jq -er '.proposal.proposalId | select(type == "string" and length > 0)' "${response}")"
          proposal_digest="$(jq -er '.proposal.proposalDigest | select(test("^(sha256:)?[0-9a-f]{64}$"))' "${response}")"
          finalization_nonce="$(jq -er '.finalizationNonce | select(type == "string" and length >= 32)' "${response}")"
          echo "::add-mask::${finalization_nonce}"
          jq -ce \
            --arg attemptId "${ATTEMPT_ID}" \
            --arg proposalId "${proposal_id}" \
            '.proposal | select(
              .protocolVersion == "1.0" and
              .attemptId == $attemptId and
              .proposalId == $proposalId and
              (.baseRevision | type == "string" and test("^[0-9a-f]{40}$")) and
              (.targetRevision | type == "string" and test("^[0-9a-f]{40}$")) and
              (.unifiedDiff | type == "string") and
              (.patchDigest | test("^(sha256:)?[0-9a-f]{64}$"))
            )' "${response}" | jq -cSj . > "${PROPOSAL_PATH}"
          proposal_artifact_digest="$(sha256sum "${PROPOSAL_PATH}" | cut -d ' ' -f 1)"
          test "$(wc -c < "${PROPOSAL_PATH}")" -le 2097152

          printf 'proposal_id=%s\n' "${proposal_id}" >> "${GITHUB_OUTPUT}"
          printf 'proposal_digest=%s\n' "${proposal_digest}" >> "${GITHUB_OUTPUT}"
          printf 'proposal_artifact_digest=%s\n' "${proposal_artifact_digest}" >> "${GITHUB_OUTPUT}"
          printf 'finalization_nonce=%s\n' "${finalization_nonce}" >> "${GITHUB_OUTPUT}"

      - name: Upload inert proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-healing-proposal-${{ inputs.attempt_id }}
          path: ${{ runner.temp }}/elsa-healing-proposal.json
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate proposal without Platform credentials
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      result_digest: ${{ steps.validate.outputs.result_digest }}
    steps:
      - name: Download inert proposal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: elsa-healing-proposal-${{ inputs.attempt_id }}
          path: ${{ runner.temp }}/elsa-healing-proposal

      - name: Check out the approved revision without stored credentials
        id: checkout
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.expected_target_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify, apply, and validate the exact proposal
        id: validate
        shell: bash
        env:
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          PROPOSAL_ID: ${{ needs.propose.outputs.proposal_id }}
          PROPOSAL_DIGEST: ${{ needs.propose.outputs.proposal_digest }}
          PROPOSAL_ARTIFACT_DIGEST: ${{ needs.propose.outputs.proposal_artifact_digest }}
          EXPECTED_TARGET_REVISION: ${{ inputs.expected_target_revision }}
          PRODUCING_REVISION_STATUS: ${{ inputs.producing_revision_status }}
          PRODUCING_REVISION: ${{ inputs.producing_revision }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PROPOSAL_PATH: ${{ runner.temp }}/elsa-healing-proposal/elsa-healing-proposal.json
          RESULT_PATH: ${{ runner.temp }}/elsa-healing-validation-result.json
        run: |
          set -u
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          started_epoch="$(date +%s)"
          validation_status=failed
          validation_summary='Validation did not start.'
          harness=none
          harness_exit_code=125
          producing_revision_available=false
          producing_worktree=''
          patch_path="${RUNNER_TEMP}/elsa-healing.patch"
          harness_log="${RUNNER_TEMP}/elsa-healing-validation.log"
          : > "${harness_log}"

          cleanup() {
            test -z "${producing_worktree}" || git worktree remove --force "${producing_worktree}" 2>/dev/null || true
          }
          trap cleanup EXIT

          if test "${CHECKOUT_OUTCOME}" != success; then
            validation_summary='The approved base revision could not be checked out.'
          elif ! test -s "${PROPOSAL_PATH}"; then
            validation_summary='The proposal artifact is missing.'
          elif ! actual_proposal_artifact_digest="$(sha256sum "${PROPOSAL_PATH}" | cut -d ' ' -f 1)" || test "${actual_proposal_artifact_digest}" != "${PROPOSAL_ARTIFACT_DIGEST}"; then
            validation_summary='The proposal artifact digest does not match the trusted proposal.'
          elif ! jq -e \
            --arg attemptId "${ATTEMPT_ID}" \
            --arg proposalId "${PROPOSAL_ID}" \
            --arg proposalDigest "${PROPOSAL_DIGEST}" \
            --arg targetRevision "${EXPECTED_TARGET_REVISION}" \
            '.protocolVersion == "1.0" and .attemptId == $attemptId and .proposalId == $proposalId and .proposalDigest == $proposalDigest and .targetRevision == $targetRevision' \
            "${PROPOSAL_PATH}" >/dev/null; then
            validation_summary='The proposal is not bound to this attempt and target revision.'
          elif test "$(git rev-parse HEAD)" != "${EXPECTED_TARGET_REVISION}"; then
            validation_summary='The checked-out revision differs from the approved base revision.'
          else
            jq -jer '.unifiedDiff' "${PROPOSAL_PATH}" > "${patch_path}"
            expected_patch_digest="$(jq -er '.patchDigest' "${PROPOSAL_PATH}")"
            expected_patch_digest="${expected_patch_digest#sha256:}"
            actual_patch_digest="$(sha256sum "${patch_path}" | cut -d ' ' -f 1)"
            if test "${actual_patch_digest}" != "${expected_patch_digest}"; then
              validation_summary='The exact patch digest is invalid.'
            elif ! git apply --check --index --whitespace=nowarn "${patch_path}" >"${harness_log}" 2>&1; then
              validation_summary='The exact patch does not apply cleanly to the approved base revision.'
            elif ! git apply --index --whitespace=nowarn "${patch_path}" >>"${harness_log}" 2>&1; then
              validation_summary='The exact patch could not be applied.'
            else
              unsafe_path=false
              while IFS= read -r -d '' changed_path; do
                case "/${changed_path}" in
                  */.github/workflows/*|*/.elsa/healing/*|*/.git/*) unsafe_path=true ;;
                esac
              done < <(git diff --cached --name-only -z)

              if test "${unsafe_path}" = true; then
                validation_summary='The proposal changes a protected automation path.'
              else
                if test "${PRODUCING_REVISION_STATUS}" = verified && test -n "${PRODUCING_REVISION}" && git cat-file -e "${PRODUCING_REVISION}^{commit}"; then
                  producing_worktree="${RUNNER_TEMP}/elsa-healing-producing"
                  if git worktree add --detach "${producing_worktree}" "${PRODUCING_REVISION}" >>"${harness_log}" 2>&1; then
                    producing_revision_available=true
                  fi
                fi

                if test -x .elsa/healing/validate; then
                  harness=.elsa/healing/validate
                  ELSA_HEALING_ATTEMPT_ID="${ATTEMPT_ID}" \
                  ELSA_HEALING_PROPOSAL_ID="${PROPOSAL_ID}" \
                  ELSA_HEALING_PROPOSAL_DIGEST="${PROPOSAL_DIGEST}" \
                  ELSA_HEALING_TARGET_REVISION="${EXPECTED_TARGET_REVISION}" \
                  ELSA_HEALING_PRODUCING_REVISION="${PRODUCING_REVISION}" \
                  ELSA_HEALING_PRODUCING_REVISION_STATUS="${PRODUCING_REVISION_STATUS}" \
                  ELSA_HEALING_PRODUCING_WORKTREE="${producing_worktree}" \
                  env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
                    .elsa/healing/validate >>"${harness_log}" 2>&1
                  harness_exit_code="$?"
                else
                  harness=static-diff-check
                  git diff --cached --check >>"${harness_log}" 2>&1
                  harness_exit_code="$?"
                fi

                if test "${harness_exit_code}" -eq 0; then
                  validation_status=passed
                  validation_summary='The exact proposal passed validation.'
                else
                  validation_summary='The exact proposal failed the repository validation harness.'
                fi
              fi
            fi
          fi

          # The validation lane is intentionally untrusted. It copies the managed
          # proposal's inference-owned fields and adds validation evidence only;
          # Platform re-binds and re-evaluates every field before publication.
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          completed_epoch="$(date +%s)"
          duration_seconds="$((completed_epoch - started_epoch))"
          duration="$(printf '%02d:%02d:%02d' "$((duration_seconds / 3600))" "$(((duration_seconds % 3600) / 60))" "$((duration_seconds % 60))")"
          reproduction_attempted=false
          reproduction_succeeded=false
          reproduction_classification=not-attempted
          reproduction_summary='The validation lane did not reproduce the original failure.'
          proposal_classification="$(jq -er '.classification' "${PROPOSAL_PATH}")"
          if test "${proposal_classification}" = reproduced; then
            reproduction_attempted=true
            reproduction_succeeded=true
            reproduction_classification=reproduced
            reproduction_summary='The managed proposal is bound to previously reproduced evidence.'
          fi
          jq -cn \
            --arg attemptId "${ATTEMPT_ID}" \
            --arg proposalId "${PROPOSAL_ID}" \
            --arg proposalDigest "${PROPOSAL_DIGEST}" \
            --arg status "${validation_status}" \
            --arg summary "${validation_summary}" \
            --arg harness "${harness}" \
            --argjson harnessExitCode "${harness_exit_code}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --argjson workflowRunAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg duration "${duration}" \
            --arg startedAt "${started_at}" \
            --arg completedAt "${completed_at}" \
            --arg reproductionClassification "${reproduction_classification}" \
            --arg reproductionSummary "${reproduction_summary}" \
            --argjson reproductionAttempted "${reproduction_attempted}" \
            --argjson reproductionSucceeded "${reproduction_succeeded}" \
            --slurpfile proposal "${PROPOSAL_PATH}" \
            '$proposal[0] as $p | {protocolVersion:"1.0",attemptId:$attemptId,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,baseRevision:$p.baseRevision,targetRevision:$p.targetRevision,classification:$p.classification,confidence:$p.confidence,causalSummary:$p.causalSummary,unifiedDiff:$p.unifiedDiff,patchDigest:$p.patchDigest,changedPaths:$p.changedPaths,reproduction:{wasAttempted:$reproductionAttempted,wasReproduced:$reproductionSucceeded,classification:$reproductionClassification,summary:$reproductionSummary,commands:[]},regression:{wasAdded:false,summary:"No regression-test claim was made by the isolated validation lane.",changedTests:[]},validation:[{kind:"repository",command:$harness,outcome:$status,safeSummary:($summary + " Exit code: " + ($harnessExitCode|tostring) + "."),duration:$duration}],riskSuggestions:$p.riskSuggestions,rollbackSummary:$p.rollbackSummary,usage:($p.usage + {repositoryRunDuration:$duration,repositoryRuns:1}),timing:{startedAt:$startedAt,completedAt:$completedAt},submittedAt:$completedAt,proposalId:$proposalId,proposalDigest:$proposalDigest}' \
            | jq -cSj . > "${RESULT_PATH}"
          result_digest="$(sha256sum "${RESULT_PATH}" | cut -d ' ' -f 1)"
          printf 'result_digest=%s\n' "${result_digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload inert validation result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elsa-healing-validation-${{ inputs.attempt_id }}
          path: ${{ runner.temp }}/elsa-healing-validation-result.json
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Finalize repair result
    needs: [propose, validate]
    if: ${{ always() && needs.propose.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download inert validation result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: elsa-healing-validation-${{ inputs.attempt_id }}
          path: ${{ runner.temp }}/elsa-healing-validation

      - name: Exchange finalization nonce for a result capability
        id: capability
        shell: bash
        env:
          PLATFORM_BASE_URL: ${{ inputs.platform_url }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          PROPOSAL_ID: ${{ needs.propose.outputs.proposal_id }}
          PROPOSAL_DIGEST: ${{ needs.propose.outputs.proposal_digest }}
          RESULT_DIGEST: ${{ needs.validate.outputs.result_digest }}
          FINALIZATION_NONCE: ${{ needs.propose.outputs.finalization_nonce }}
          WORKLOAD_AUDIENCE: ${{ inputs.workload_audience }}
          RESULT_PATH: ${{ runner.temp }}/elsa-healing-validation/elsa-healing-validation-result.json
        run: |
          set -euo pipefail
          test "${PLATFORM_BASE_URL#https://}" != "${PLATFORM_BASE_URL}"
          test "$(sha256sum "${RESULT_PATH}" | cut -d ' ' -f 1)" = "${RESULT_DIGEST}"
          jq -e \
            --arg attemptId "${ATTEMPT_ID}" \
            --arg proposalId "${PROPOSAL_ID}" \
            --arg proposalDigest "${PROPOSAL_DIGEST}" \
            '.protocolVersion == "1.0" and .attemptId == $attemptId and .proposalId == $proposalId and .proposalDigest == $proposalDigest' \
            "${RESULT_PATH}" >/dev/null

          identity_assertion="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(jq -rn --arg value "${WORKLOAD_AUDIENCE}" '$value|@uri')" | jq -er '.value')"
          exchange_payload="$(jq -cn \
            --arg attemptId "${ATTEMPT_ID}" \
            --arg proposalId "${PROPOSAL_ID}" \
            --arg nonce "${FINALIZATION_NONCE}" \
            --arg assertion "${identity_assertion}" \
            '{protocolVersion:"1.0",attemptId:$attemptId,proposalId:$proposalId,oneTimeNonce:$nonce,identityAssertion:$assertion}')"
          capability="$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary "${exchange_payload}" \
            "${PLATFORM_BASE_URL%/}/api/workspaces/${WORKSPACE_ID}/healing/workload/attempts/${ATTEMPT_ID}/proposals/${PROPOSAL_ID}/finalize-exchange" | jq -er '.capabilityToken')"
          echo "::add-mask::${capability}"
          printf 'token=%s\n' "${capability}" >> "${GITHUB_OUTPUT}"

      - name: Upload final result without checking out repository content
        shell: bash
        env:
          PLATFORM_BASE_URL: ${{ inputs.platform_url }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          PROPOSAL_ID: ${{ needs.propose.outputs.proposal_id }}
          PROPOSAL_DIGEST: ${{ needs.propose.outputs.proposal_digest }}
          RESULT_DIGEST: ${{ needs.validate.outputs.result_digest }}
          CAPABILITY_TOKEN: ${{ steps.capability.outputs.token }}
          RESULT_PATH: ${{ runner.temp }}/elsa-healing-validation/elsa-healing-validation-result.json
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/elsa-healing-final-result.json"
          jq -cn \
            --arg attemptId "${ATTEMPT_ID}" \
            --arg idempotencyKey "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PROPOSAL_ID}-result" \
            --slurpfile result "${RESULT_PATH}" \
            '{protocolVersion:"1.0",attemptId:$attemptId,idempotencyKey:$idempotencyKey,result:$result[0]}' \
            > "${payload}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CAPABILITY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@${payload}" \
            "${PLATFORM_BASE_URL%/}/api/workspaces/${WORKSPACE_ID}/healing/workload/attempts/${ATTEMPT_ID}/result" \
            >/dev/null
